name: Docker Build

on:
  push:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t zero-touch-dashboard .

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: zero-touch-dashboard
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag zero-touch-dashboard lobiya/zero-touch-devops-dashboard:latest

      - name: Push Docker image
        run: docker push lobiya/zero-touch-devops-dashboard:latest
